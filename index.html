<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ed1c24">
  <title>Pay1 To-Do</title>
  <style>
    :root { color-scheme: light; --red: #ed1c24; --ink: #111; --paper: #fffaf7; --muted: #716b68; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 32px 18px; color: var(--ink); background: #f5eee9; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, input { font: inherit; }
    .app { width: min(100%, 760px); margin: 0 auto; overflow: hidden; border: 3px solid var(--ink); border-radius: 20px; background: var(--paper); box-shadow: 9px 9px 0 var(--ink); }
    header { position: relative; padding: 28px clamp(20px, 6vw, 46px) 32px; color: white; background: var(--red); border-bottom: 3px solid var(--ink); }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .brand-mark { display: grid; width: 43px; height: 43px; place-items: center; border: 2px solid var(--ink); border-radius: 12px; color: var(--ink); background: white; font-size: 21px; font-weight: 950; }
    .brand-name { font-size: 20px; font-weight: 900; letter-spacing: -.06em; }
    .brand-tag { margin-left: auto; padding: 6px 10px; border: 2px solid var(--ink); border-radius: 999px; color: var(--ink); background: white; font-size: 11px; font-weight: 850; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(36px, 8vw, 60px); line-height: .98; letter-spacing: -.07em; font-weight: 950; }
    .subtitle { margin: 12px 0 0; color: #fff1f1; font-size: 15px; }
    main { padding: 26px clamp(20px, 6vw, 46px) 34px; }
    .entry { display: flex; gap: 10px; margin-bottom: 24px; }
    .entry input { min-width: 0; flex: 1; padding: 14px 15px; border: 2px solid var(--ink); border-radius: 10px; outline: none; background: white; }
    .entry input:focus { box-shadow: 0 0 0 3px #ed1c2440; }
    button { cursor: pointer; border: 2px solid var(--ink); border-radius: 10px; font-weight: 850; transition: transform .12s, box-shadow .12s; }
    button:hover { transform: translate(-1px, -1px); box-shadow: 2px 2px 0 var(--ink); }
    .add { padding: 0 20px; color: white; background: var(--red); }
    .toolbar { display: flex; align-items: center; gap: 8px; padding-bottom: 15px; border-bottom: 2px solid var(--ink); }
    .count { margin-right: auto; color: var(--muted); font-size: 13px; font-weight: 700; }
    .filter { padding: 7px 11px; color: var(--ink); background: transparent; font-size: 12px; }
    .filter.active { color: white; background: var(--ink); }
    .tasks { display: grid; gap: 10px; padding: 17px 0 4px; }
    .task { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border: 2px solid var(--ink); border-radius: 11px; background: white; }
    .task input { width: 19px; height: 19px; margin: 0; accent-color: var(--red); cursor: pointer; }
    .task-text { flex: 1; overflow-wrap: anywhere; font-weight: 650; }
    .task.done .task-text { color: #89817d; text-decoration: line-through; }
    .delete { width: 34px; height: 34px; color: var(--ink); background: #fff1f1; font-size: 18px; line-height: 1; }
    .empty { padding: 34px 12px; color: var(--muted); text-align: center; }
    .empty strong { display: block; margin-bottom: 5px; color: var(--ink); font-size: 17px; }
    .status { min-height: 19px; margin: 12px 0 0; color: var(--muted); font-size: 12px; text-align: center; }
    @media (max-width: 460px) { body { padding: 16px 12px; } .app { box-shadow: 5px 5px 0 var(--ink); } .entry { flex-wrap: wrap; } .entry input { flex-basis: 100%; } .add { min-height: 44px; flex: 1; } .filter { padding: 7px 8px; } }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand"><div class="brand-mark" aria-hidden="true">P</div><div class="brand-name">Pay1</div><div class="brand-tag">My day, sorted</div></div>
      <h1>To-do list<span aria-hidden="true">.</span></h1>
      <p class="subtitle">One thing at a time. You’ve got this.</p>
    </header>
    <main>
      <form class="entry" id="task-form">
        <input id="task-input" type="text" maxlength="180" placeholder="What needs doing?" aria-label="New task" autocomplete="off" required>
        <button class="add" type="submit">＋ Add task</button>
      </form>
      <div class="toolbar" aria-label="Task filters">
        <span class="count" id="count">0 tasks</span>
        <button class="filter active" type="button" data-filter="all">All</button>
        <button class="filter" type="button" data-filter="active">To do</button>
        <button class="filter" type="button" data-filter="done">Done</button>
      </div>
      <section class="tasks" id="tasks" aria-live="polite" aria-label="Your tasks"></section>
      <p class="status" id="status" role="status"></p>
    </main>
  </div>
  <script>
    (() => {
      const STORAGE_KEY = 'pay1-todo-tasks-v1';
      const form = document.querySelector('#task-form');
      const input = document.querySelector('#task-input');
      const list = document.querySelector('#tasks');
      const count = document.querySelector('#count');
      const status = document.querySelector('#status');
      let tasks = [];
      let filter = 'all';
      let useApi = true;

      function saveLocal() { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }
      async function request(path, options = {}) {
        const response = await fetch('/api/tasks' + path, { ...options, headers: { 'Content-Type': 'application/json', ...(options.headers || {}) } });
        if (!response.ok) throw new Error('API request failed (' + response.status + ')');
        return response.status === 204 ? null : response.json();
      }
      async function load() {
        try {
          tasks = await request('');
          useApi = true;
          status.textContent = 'Synced with the Pay1 task service.';
        } catch (_) {
          useApi = false;
          try { tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch (_) { tasks = []; }
          status.textContent = 'Saved on this device.';
        }
        render();
      }
      async function persist(method, id, body) {
        if (useApi) {
          try {
            await request(id ? '/' + encodeURIComponent(id) : '', { method, ...(body ? { body: JSON.stringify(body) } : {}) });
            status.textContent = 'Synced with the Pay1 task service.';
            return;
          } catch (_) {
            useApi = false;
            status.textContent = 'Backend unavailable — saved on this device instead.';
          }
        }
        saveLocal();
      }
      function render() {
        const visible = tasks.filter(task => filter === 'all' || (filter === 'active' ? !task.completed : task.completed));
        const remaining = tasks.filter(task => !task.completed).length;
        count.textContent = remaining + ' left · ' + tasks.length + ' total';
        list.replaceChildren();
        if (!visible.length) {
          const empty = document.createElement('div'); empty.className = 'empty';
          const title = document.createElement('strong'); title.textContent = tasks.length ? 'Nothing in this view' : 'Your list is clear';
          const message = document.createElement('span'); message.textContent = tasks.length ? 'Try another filter.' : 'Add a task above to get started.';
          empty.append(title, message); list.append(empty); return;
        }
        for (const task of visible) {
          const row = document.createElement('article'); row.className = 'task' + (task.completed ? ' done' : '');
          const checkbox = document.createElement('input'); checkbox.type = 'checkbox'; checkbox.checked = task.completed; checkbox.setAttribute('aria-label', 'Mark ' + task.text + ' ' + (task.completed ? 'to do' : 'done'));
          checkbox.addEventListener('change', async () => { task.completed = checkbox.checked; render(); await persist('PATCH', task.id, { completed: task.completed }); });
          const text = document.createElement('span'); text.className = 'task-text'; text.textContent = task.text;
          const remove = document.createElement('button'); remove.className = 'delete'; remove.type = 'button'; remove.textContent = '×'; remove.setAttribute('aria-label', 'Delete ' + task.text);
          remove.addEventListener('click', async () => { tasks = tasks.filter(item => item.id !== task.id); render(); await persist('DELETE', task.id); });
          row.append(checkbox, text, remove); list.append(row);
        }
      }
      form.addEventListener('submit', async event => {
        event.preventDefault(); const text = input.value.trim(); if (!text) return;
        const task = { id: (globalThis.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2), text, completed: false };
        tasks.unshift(task); input.value = ''; filter = 'all'; document.querySelectorAll('.filter').forEach(button => button.classList.toggle('active', button.dataset.filter === filter)); render();
        await persist('POST', null, { id: task.id, text: task.text }); input.focus();
      });
      document.querySelectorAll('.filter').forEach(button => button.addEventListener('click', () => { filter = button.dataset.filter; document.querySelectorAll('.filter').forEach(item => item.classList.toggle('active', item === button)); render(); }));
      load();
    })();
  </script>
</body>
</html>
